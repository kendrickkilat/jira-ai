name: Send PR Code Changes

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  send-code-changes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3  # Updated to v3

      - name: Get Code Changes
        id: get_code_changes
        env:
          GH_TOKEN: ${{ secrets.MY_ACCESS_TOKEN}}
        # run: |
        #   # Get the code changes between the last commit on the base branch and the current commit
        #   response=$(curl -L \
        #   -H "Accept: application/vnd.github+json" \
        #   -H "Authorization: Bearer ${{ env.GH_TOKEN }}" \
        #   -H "X-GitHub-Api-Version: 2022-11-28" \
        #   https://api.github.com/repos/${{github.repository}}/pulls/${{github.event.pull_request.number}}/files)
        #   changes=$(echo "${response}" | jq -c '.' | base64)  # Extract the array of objects
        #   echo "::set-output name=changes::${changes}"  # Set the output variable 
        run: |
         echo "Running gh pr diff"
         diff=$(gh pr diff --patch)
         echo "Diff command executed"
         echo "$diff"
         echo "Setting output variable"
         echo "combined=$diff" >> $GITHUB_OUTPUT
      - name: Send code changes to API
        if: steps.get_code_changes.outputs.combined != ''
        run: |
          CODE_CHANGES="${{ steps.get_code_changes.outputs.combined }}"
          echo "code-changes: ${CODE_CHANGES}"
          curl -X POST https://jira-ai-gamma.vercel.app/api/github \
            -H "Content-Type: application/json" \
            -d "{\"code_changes\": \"${CODE_CHANGES}\"}"
